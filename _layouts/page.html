---
layout: default
---
<article class="post{% if page.hero %} post--hero{% endif %}">

  <header class="post-header{% if page.hero %} post-header--hero{% endif %}">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {%- if page.tagline -%}
      <p class="post-tagline">{{ page.tagline }}</p>
    {%- endif -%}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
